                story: "作品以極其滑稽、幼稚且拙劣嘅線條描繪一頭母牛：母牛身軀龐大笨重，四肢如幾根細木棍，尾巴奇特高高舉起，背景與體表混雜著粗糙泥土與顏料肌理。這是杜布菲著名《母牛》系列名作，刻意選擇世俗母牛為題材，透過塗鴉般畫筆嘲諷博物館對高雅理想美嘅執念。",
                techStatus: "展現咗獨創嘅「肌理美學」（Texturology）。喺油畫顏料中混合沙土、瀝青、泥炭與碎屑，使畫布呈現如破舊牆壁般極其粗糙凹凸不平嘅物理肌理；線條如用釘子劃過般稚拙大膽。直接啟發咗塗鴉藝術（巴斯奇亞、哈林）、新表現主義與當代前衛視覺藝術。",
                guide: "請湊近觀察畫面上混合咗沙土與顏料嘅粗糙凹凸肌理：欣賞那頭線條笨拙、造型滑稽嘅母牛，放下所有關於「畫得像不像、美不美」嘅傳統審美包袱，體會杜布菲如何透過這種原生塗鴉嘅力量，帶領我們回歸視覺創作最原始、最不加粉飾嘅爆發力與快樂。"
            }
        ];

        // 頁面動態渲染與 初始化
        const container = document.getElementById('artwork-list');
        const jumpSelect = document.getElementById('quickJumpSelect');

        function renderApp() {
            container.innerHTML = '';
            jumpSelect.innerHTML = '<option value="">🎯 快速跳轉作品 (01 - 59)...</option>';

            artworks.forEach((art) => {
                // 1. 動態填充下拉 Jump 選單
                const opt = document.createElement('option');
                opt.value = `art-${art.id}`;
                opt.innerText = `${art.id}. ${art.titleZh} (${art.titleEn})`;
                jumpSelect.appendChild(opt);

                // 2. 構建卡片
                const card = document.createElement('div');
                card.className = 'artwork-card';
                card.id = `art-${art.id}`;
                card.setAttribute('data-zone', art.zoneKey);
                card.setAttribute('data-search', `${art.id} ${art.titleZh} ${art.titleEn} ${art.artist}`.toLowerCase());

                // 圖片預留位置處理
                let imageHtml = '';
                if (art.imgUrl && art.imgUrl.trim() !== '') {
                    imageHtml = `<div class="img-container"><img src="${art.imgUrl}" alt="${art.titleZh}"></div>`;
                } else {
                    imageHtml = `
                        <div class="img-container">
                            <div class="img-placeholder">
                                🖼️ <strong>圖片位置預留區 (Image URL Reserved)</strong><br>
                                <small>待輸入連結：${art.titleEn}</small>
                            </div>
                        </div>`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="badge-id">NO. ${art.id}</span>
                            <span class="zone-tag">${art.zoneName}</span>
                        </div>
                        <span class="year-tag">${art.year}</span>
                    </div>

                    ${imageHtml}

                    <div class="card-body">
                        <div class="artist-title">${art.artist}</div>
                        <h2 class="title-zh">${art.titleZh}</h2>
                        <div class="title-en">${art.titleEn}</div>

                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="detail-label">【作者簡介】</span>
                                <div>${art.bio}</div>
                            </div>
                            <div class="detail-item story-item">
                                <span class="detail-label">【作品背景與小故事】</span>
                                <div>${art.story}</div>
                            </div>
                            <div class="detail-item tech-item">
                                <span class="detail-label">【藝術技巧與地位】</span>
                                <div>${art.techStatus}</div>
                            </div>
                            <div class="detail-item guide-item">
                                <span class="detail-label">【賞析方法與角度】</span>
                                <div>${art.guide}</div>
                            </div>
                        </div>

                        <div class="controls">
                            <button class="btn btn-play" onclick="playCantonese('${art.id}', '${art.titleZh}', '${art.bio}', '${art.story}', '${art.guide}')">
                                🔊 廣東話語音導賞
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 🎯 快速跳轉 (Jump to Artwork)
        function jumpToArtwork(elementId) {
            if (!elementId) return;
            const target = document.getElementById(elementId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 🔍 展區 Filter + 關鍵字搜尋 (Filter & Search)
        function filterArtworks() {
            const selectedZone = document.getElementById('zoneFilter').value;
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.artwork-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const cardZone = card.getAttribute('data-zone');
                const searchData = card.getAttribute('data-search');

                const matchesZone = (selectedZone === 'ALL' || cardZone === selectedZone);
                const matchesQuery = (query === '' || searchData.includes(query));

                if (matchesZone && matchesQuery) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('noResults').style.display = (visibleCount === 0) ? 'block' : 'none';
        }

        // 🗣️ 廣東話語音朗讀 (Cantonese Web Speech API)
        const synth = window.speechSynthesis;
        const statusEl = document.getElementById('player-status');

        function playCantonese(id, title, bio, story, guide) {
            if (!('speechSynthesis' in window)) {
                alert('抱歉，您嘅瀏覽器唔支援語音播放功能。');
                return;
            }

            synth.cancel(); // 停止先前語音

            // 構建廣東話朗讀內容（精簡核心，兼顧賞析要點）
            const textToSpeech = `作品編號${id}，${title}。${bio}。作品故事：${story}。賞析建議：${guide}`;

            const utterance = new SpeechSynthesisUtterance(textToSpeech);
            utterance.lang = 'zh-HK'; // 指定廣東話 / 香港粵語
            utterance.rate = 0.92;    // 設定快適語速

            // 優先挑選廣東話 Voice
            const voices = synth.getVoices();
            const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh-GZ' || v.lang.includes('yue'));
            if (hkVoice) {
                utterance.voice = hkVoice;
            }

            utterance.onstart = () => {
                statusEl.innerText = `▶️ 正在播放 NO.${id}：${title}`;
            };

            utterance.onend = () => {
                statusEl.innerText = '⏹️ 導賞播放完畢';
            };

            utterance.onerror = () => {
                statusEl.innerText = '❌ 語音播放發生錯誤';
            };

            synth.speak(utterance);
        }

        function stopSpeech() {
            synth.cancel();
            statusEl.innerText = '⏹️ 導賞已停止播放';
        }

        // 頁面載入後初始化
        window.onload = renderApp;
    </script>
</body>
</html>
