        // 初始化與 DOM 繪製
        const container = document.getElementById('artwork-list');
        const jumpSelect = document.getElementById('quickJumpSelect');

        function renderApp() {
            container.innerHTML = '';
            jumpSelect.innerHTML = '<option value="">🎯 快速跳轉作品 (01 - 59)...</option>';

            artworks.forEach((art) => {
                // 1. 填充跳轉下拉選單 (Requirement 2: 保持 01-59 順序)
                const opt = document.createElement('option');
                opt.value = `art-${art.id}`;
                opt.innerText = `${art.id}. ${art.titleZh} (${art.titleEn})`;
                jumpSelect.appendChild(opt);

                // 2. 構建作品卡片
                const card = document.createElement('div');
                card.className = 'artwork-card';
                card.id = `art-${art.id}`;
                card.setAttribute('data-zone', art.zoneKey);
                card.setAttribute('data-search', `${art.id} ${art.titleZh} ${art.titleEn} ${art.artist}`.toLowerCase());

                // 處理圖片預留位置 (Requirement 4)
                let imageHtml = '';
                if (art.imgUrl && art.imgUrl.trim() !== '') {
                    imageHtml = `<div class="img-container"><img src="${art.imgUrl}" alt="${art.titleZh}"></div>`;
                } else {
                    imageHtml = `
                        <div class="img-container">
                            <div class="img-placeholder">
                                🖼️ <strong>圖片位置預留區 (Image URL Reserved)</strong><br>
                                <small>待輸入連結：${art.titleEn}</small>
                            </div>
                        </div>`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="badge-id">NO. ${art.id}</span>
                            <span class="zone-tag">${art.zoneName}</span>
                        </div>
                        <span class="year-tag">${art.year}</span>
                    </div>

                    ${imageHtml}

                    <div class="card-body">
                        <div class="artist-title">${art.artist}</div>
                        <h2 class="title-zh">${art.titleZh}</h2>
                        <div class="title-en">${art.titleEn}</div>

                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="detail-label">【作者簡介】</span>
                                <div>${art.bio}</div>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">【創作技巧與解析】</span>
                                <div>${art.tech}</div>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">【美術史地位】</span>
                                <div>${art.status}</div>
                            </div>
                            <div class="detail-item story-item">
                                <span class="detail-label">【作品故事與趣聞】</span>
                                <div>${art.story}</div>
                            </div>
                            <div class="detail-item impact-item">
                                <span class="detail-label">【受之前影響】</span>
                                <div>${art.prior}</div>
                            </div>
                            <div class="detail-item impact-item">
                                <span class="detail-label">【對之後影響】</span>
                                <div>${art.later}</div>
                            </div>
                        </div>

                        <div class="controls">
                            <button class="btn btn-play" onclick="playCantonese('${art.id}', '${art.titleZh}', '${art.bio}', '${art.story}', '${art.status}')">
                                🔊 廣東話語音導賞
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 🎯 快速跳轉 (Jump to Artwork)
        function jumpToArtwork(elementId) {
            if (!elementId) return;
            const target = document.getElementById(elementId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 🔍 展區篩選與關鍵字搜尋組合功能 (Filter & Search)
        function filterArtworks() {
            const selectedZone = document.getElementById('zoneFilter').value;
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.artwork-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const cardZone = card.getAttribute('data-zone');
                const searchData = card.getAttribute('data-search');

                const matchesZone = (selectedZone === 'ALL' || cardZone === selectedZone);
                const matchesQuery = (query === '' || searchData.includes(query));

                if (matchesZone && matchesQuery) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('noResults').style.display = (visibleCount === 0) ? 'block' : 'none';
        }

        // 🗣️ 廣東話語音朗讀核心 (Cantonese Web Speech API)
        const synth = window.speechSynthesis;
        const statusEl = document.getElementById('player-status');

        function playCantonese(id, title, bio, story, status) {
            if (!('speechSynthesis' in window)) {
                alert('抱歉，您嘅瀏覽器唔支援語音播放功能。');
                return;
            }

            synth.cancel(); // 停止先前的語音

            // 構建流暢廣東話朗讀文稿
            const textToSpeech = `作品編號${id}，${title}。${bio}。故事背景：${story}。美術史地位：${status}。`;

            const utterance = new SpeechSynthesisUtterance(textToSpeech);
            utterance.lang = 'zh-HK'; // 指定廣東話 / 香港粵語
            utterance.rate = 0.7;    // 設定舒適語速

            // 優先挑選廣東話 Voice
            const voices = synth.getVoices();
            const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh-GZ' || v.lang.includes('yue'));
            if (hkVoice) {
                utterance.voice = hkVoice;
            }

            utterance.onstart = () => {
                statusEl.innerText = `▶️ 正在播放 NO.${id}：${title}`;
            };

            utterance.onend = () => {
                statusEl.innerText = '⏹️ 導賞播放完畢';
            };

            utterance.onerror = () => {
                statusEl.innerText = '❌ 語音播放發生錯誤';
            };

            synth.speak(utterance);
        }

        function stopSpeech() {
            synth.cancel();
            statusEl.innerText = '⏹️ 導賞已停止播放';
        }

        // 頁面載入完成後初始化渲染
        window.onload = renderApp;
    </script>
